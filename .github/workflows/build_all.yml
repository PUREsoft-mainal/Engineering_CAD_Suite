name: Build & Sign Desktop (Win/Linux) & Android (APK/AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. بناء نسخة الويندوز التنفيذية (.exe)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pyinstaller ezdxf schemdraw
      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Engineering_CAD_Suite_Win" --add-data "modules;modules" main_gui.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Desktop-EXE
          path: dist/Engineering_CAD_Suite_Win.exe

  # 2. بناء نسخة لينكس
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tkinter & dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk
          pip install pyinstaller ezdxf schemdraw
      - name: Build Linux Binary
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Engineering_CAD_Suite_Linux" --add-data "modules:modules" main_gui.py
      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Desktop-App
          path: dist/Engineering_CAD_Suite_Linux

  # 3. بناء وتوقيع نسخة الأندرويد مباشرة بدون Docker
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python & Java 17
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System & Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Build Android Release (APK & AAB)
        run: |
          yes | buildozer android debug
          yes | buildozer android release

      - name: Decode Keystore & Sign AAB/APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release-key.keystore
          
          for aab in bin/*.aab; do
            if [ -f "$aab" ]; then
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore release-key.keystore \
                -storepass "$KEYSTORE_PASSWORD" \
                -keypass "$KEY_PASSWORD" \
                "$aab" "$KEY_ALIAS"
            fi
          done

          for apk in bin/*.apk; do
            if [ -f "$apk" ]; then
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore release-key.keystore \
                -storepass "$KEYSTORE_PASSWORD" \
                -keypass "$KEY_PASSWORD" \
                "$apk" "$KEY_ALIAS"
            fi
          done

          rm -f release-key.keystore

      - name: Upload Signed Android APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Android-APK-and-AAB
          path: bin/*
